#@TYPE: Machine
#@NAME: qcs610-odk (64-bit)
#@DESCRIPTION: Machine configuration for qcs610-odk in 64 bits mode

require conf/machine/include/qcs610.inc

#### KERNEL ####
KERNEL_VARIANT:qti-distro-debug = "debug_defconfig"
KERNEL_VARIANT:qti-distro-perf = "perf_defconfig"
KERNEL_MODULES_LIST = "modules.list.msm.qcs610"

KERNEL_DEFCONFIG = "msm-kernel-qcs610-${KERNEL_VARIANT}"

KERNEL_CONFIG  ?= "build.config.msm.qcs610"
KERNEL_BUILD_CONFIG = "msm-kernel/${KERNEL_CONFIG}"

#### dtb ####
KERNEL_DTB_NAMES = "${@bb.utils.contains('MACHINE_SUPPORTS_DTBO', 'True', \
                    "${DTBO_DTB_NAMES}", "${NON_DTBO_DTB_NAMES}", d)}"

DTBO_DTB_NAMES     = "qcs610.dtb"
NON_DTBO_DTB_NAMES = "vendor/qcom/qcs610-iot.dtb vendor/qcom/qcs410-opk.dtb"

#### boot.img ####
KERNEL_IMAGETYPE   = "Image"
KERNEL_BASE        = "0x80000000"
KERNEL_TAGS_OFFSET = "0x81e00000"
BOOT_HEADER_VERSION = "2"

#### systemd ####
SERIAL_CONSOLE    ?= ""
SERIAL_CONSOLE:qti-distro-debug ?= "115200 ttyMSM0"

#### cmdline ####
CONSOLE_PARAM ?= ""
CONSOLE_PARAM:qti-distro-perf ?= ""
CONSOLE_PARAM:qti-distro-debug ?= "console=ttyMSM0,115200n8 earlycon=qcom_geni,0x880000 qcom_geni_serial.con_enabled=1"
KERNEL_CMD_PARAMS ?= "noinitrd rootwait ${CONSOLE_PARAM} androidboot.hardware=qcom androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 service_locator.enable=1 firmware_class.path=/lib/firmware/updates msm_rtb.filter=0x237 hibernate=nocompress noswap_randomize verity=enabled"

HIBERNATION_INSECURE_ENABLE = "True"

# Graphics configuration
PREFERRED_PROVIDER_virtual/libgles1 = "adreno"
PREFERRED_PROVIDER_virtual/libgles2 = "adreno"
PREFERRED_PROVIDER_virtual/egl      = "adreno"

# Conf with partition entries required for machine.
MACHINE_PARTITION_CONF = "qcs610-odk-partition.conf"

# filesystem configurations to be applied on image.
MACHINE_FSCONFIG_CONF = "qcs610-fsconfig.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "qcs610-filesmap"

# Define userdata dir
USERDATA_DIR = "${@bb.utils.contains('MACHINE_MNT_POINTS', '/overlay', 'overlay', 'data', d)}"

# Build architecture configuration
DEFAULTTUNE = "aarch64"

KERNEL_DYNAMIC_DEFCONFIG = "True"

# Include the default template configuration in the eSDK.
COREBASE_FILES:append = " meta-poky"

# Allow the kernel fetch task during eSDK locked-sstate validation.
sdk_extraconf:append = 'BB_SETSCENE_ENFORCE_IGNORE_TASKS:append = " linux-msm:*"'

##############################################################
# SELinux is set in enforcing mode, by default, as below;
# DEFAULT_ENFORCING ?= "enforcing"
# During bring up, to unblock the technology teams, SELinux is set to permissive.
##############################################################
DEFAULT_ENFORCING = "enforcing"

## Machine features ##
# emmc-boot:             Machine supports eMMC device
# drm:                   Machine supports DRM display drivers
# ubwc:                  Machine supports UBWC hardware
# qti-emac-dwc-eqos:     Machine supports emac-dwc-eqos driver
# qti-afr-algo:  Support QTI Auto framing algo
# qti-audio:             Machine supports QTI audio solution
# qti-bluetooth:         Machine supports QTI bluetooth solution
# qti-camera:            Machine supports QTI camera solution
# qti-cdsp:              Machine supports QTI cdsp solution
# qti-adsp:              Machine supports QTI adsp solution
# qti-ab-boot:           Machine supports a/b boot solution
# qti-display:           Machine supports QTI display solution
# qti-helium:            Machine supports QTI helium WiFi target
# qti-sensors:           Machine supports sensors qti solution
# tflite-hw-delegate:    Machine supports TFlite hardware delegates
# qti-tflite-delegate:   Machine supports Tensorflow lite hardware delegates
# qti-video:             Machine supports QTI video solution
# qti-wifi:              Machine supports wifi solution
# opencl:                Machine supports OpenCL driver
# dm-verity-bootloader:  Machine supports bootloader-based dm-verity implementation
# qti-location:          Machine supports Location solution
# fde-prebuilt           Machine feature of fde to ship hwfde-service in prebuilts

MACHINE_FEATURES:append = " emmc-boot drm ubwc qti-audio qti-afr-algo qti-camera qti-cdsp qti-adsp qti-ab-boot qti-display qti-helium qti-sensors-prop tflite-hw-delegate qti-tflite-delegate opencl qti-security qti-video dm-verity-initramfs-v3 qti-location qti-wifi qti-tzlog qti-crypto qti-qseecom smcinvoke qwesd file-based-encryption fde-prebuilt qti-rpmb"

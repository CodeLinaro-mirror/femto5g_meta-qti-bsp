#@TYPE: Machine
#@NAME: KALAMA
#@DESCRIPTION: Machine configuration for QTI MTP with KALAMA
BASEMACHINE ?= "kalama"
require conf/machine/include/basemachine.inc

DEFAULTTUNE ?= "aarch64"
include conf/machine/include/arm/arch-armv8a.inc
MSM_KERNEL_VERSION = "6.18"
#require recipes-kernel/linux-msm/msm-common.inc
#PREFERRED_PROVIDER:virtual/kernel = "linux-soc-repo"
#PREFERRED_VERSION:linux-soc-repo = "6.%"
PREFERRED_VERSION:linux-msm = "6.18"
PREFERRED_PROVIDER_virtual/kernel = "linux-soc-repo"
PREFERRED_VERSION_linux-soc-repo = "6.%"
PREFERRED_VERSION_linux-msm = "6.18"
# Legacy display recipes require virtual/cross-cc.
PREFERRED_PROVIDER_virtual/cross-cc = "gcc-cross-${TARGET_ARCH}"

# ENABLE_UEFI_EFI_BOOT = "1"
#PREFERRED_VERSION_edk2 = "git"
PREFERRED_VERSION_synx-kernel ?= "1.1"
PREFERRED_VERSION_securemsmdlkm ?= "1.1"
PREFERRED_VERSION_mod-blacklist ?= "1.0"
PREFERRED_PROVIDER_virtual/mkbootimg = "mkbootimg"
PREFERRED_PROVIDER_virtual/mkbootimg-native = "mkbootimg-native"
PREFERRED_VERSION_mkbootimg = "${MSM_KERNEL_VERSION}"
PREFERRED_VERSION_mkbootimg-native = "${MSM_KERNEL_VERSION}"
KERNEL_BUILD_TOOLS_ARCH = "linux_musl-x86"
HOSTTOOLS += "rsync nproc"
# clang version for kernel toolchain 6.18
USE_CLANG = "True"
#CLANG_VERSION = "r584948"
CLANG_VERSION = "r596125"
# enable aosp-llvm
INHERIT += "aospllvm"
#### KERNEL ####
KERNEL_SRC_TYPE = "soc-repo"
MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_IS_SOC_REPO = "True"
KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.kalama-le \
    modules.systemdlkm_blocklist.msm.kalama-le \
"
KERNEL_DEFCONFIG_VARIANT:qti-distro-debug = "debug-defconfig"
KERNEL_DEFCONFIG_VARIANT:qti-distro-perf = "defconfig"
KERNEL_VARIANT:qti-distro-debug ?= "debug_defconfig"
KERNEL_VARIANT:qti-distro-perf ?= "defconfig"
KERNEL_MODULES_LIST = "modules.list.msm.kalama-le"
#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""
# enable DDK build
DDK_BUILD = "true"
TARGET_BOARD_PLATFORM = "kalama-le"
KERNEL_CONFIG  = "build.config.msm.kalama.le"
KERNEL_BUILD_CONFIG = "soc-repo/${KERNEL_CONFIG}"
INITRAMFS_IMAGE = "qti-ramdisk-image"
INITRAMFS_FSTYPES = "cpio.lz4"
VENDOR_INITRAMFS_IMAGE = "qti-vendor-ramdisk-image"
# Output directories use debug_defconfig for debug and defconfig for perf.
KERNEL_DEFCONFIG:qti-distro-debug = "msm-kernel-kalama_le-debug_defconfig"
KERNEL_DEFCONFIG:qti-distro-perf = "msm-kernel-kalama_le-defconfig"
KERNEL_TYPE = "dist"
#Various kernel directories
KERNEL_PLATFORM_PATH = "${WORKSPACE}/kernel-6.18/kernel_platform"
# KERNEL_DEFCONFIG already includes the complete defconfig name.
KERNEL_PREBUILT_PATH = "${KERNEL_PLATFORM_PATH}/out/${KERNEL_DEFCONFIG}"
KERNEL_PREBUILT_DISTDIR = "${KERNEL_PREBUILT_PATH}/dist"
KERNEL_OUT_PATH = "${KERNEL_PREBUILT_PATH}"
#6.18 soc-repo keeps modules lists under modules-lists/
FILESEXTRAPATHS:prepend:pn-gki-kernel-modules = "${KERNEL_PLATFORM_PATH}/${KERNEL_SRC_TYPE}/modules-lists:"

# rootfs packages every kalama image needs (pulled in via packagegroup-core-boot)
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " gki-kernel-modules-first-stage gki-kernel-modules-second-stage adbd usb-composition usb-composition-usbd"
OUT_DIR =  "${KERNEL_PREBUILT_PATH}"

#### dtb ####
KERNEL_DTB_NAMES = "kalama.dtb kalama-v2.dtb kalamap.dtb kalamap-v2.dtb kalamap-qcs.dtb kalamap-np-qcs.dtb"

MACHINE_SUPPORTS_DTBO= "True"
BUILD_WITH_TECHPACKS = "1"
SKIP_VENDOR_BOOT = "False"

#### boot.img ####
KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
BOOT_HEADER_VERSION = "2"

#### cmdline ####
CONSOLE_PARAM:qti-distro-perf  = "qcom_geni_serial.con_enabled=0"
CONSOLE_PARAM:qti-distro-debug = "console=ttyMSM0,115200n8 earlycon qcom_geni_serial.con_enabled=1 androidboot.console=ttyMSM0 systemd.log_target=journal systemd.show_status=no"
HIBERNATION_PAPAMS = "hibernate=nocompress"
KERNEL_CMD_PARAMS = "${CONSOLE_PARAM} ${HIBERNATION_PAPAMS}"

#### systemd ####
SERIAL_CONSOLES ?= "115200;ttyMSM0"

#### others ####
PAGE_SIZE ?= '4096'
SDCARD_DEVICE = "mmcblk1p1"

#Abl would be enabled later
EXTRA_IMAGEDEPENDS += "edk2"
PREFERRED_VERSION_edk2 ?= "4.0"

# TODO: Temporary change to override BB_SIGNATURE_HANDLER set in local.conf.
# Other machines are already supporting OEEquivHash as hashing signature.

#lv-build builds the required listernes , le_qseecom enables qseecomd
MACHINE_FEATURES += "dm-verity-none"

MACHINE_MNT_POINTS = " \
	/persist \
	/firmware \
	/bt_firmware \
	/dsp \
	/overlay \
"

SYSTEM_SIZE_EXT4   ?= "2684354560"
PERSIST_SIZE_EXT4 ?= "7MiB"
# Define userdata dir, size to be used
USERDATA_DIR = "${@bb.utils.contains('MACHINE_MNT_POINTS', '/overlay', 'overlay', 'data', d)}"
USERDATA_SIZE ?= "60GiB"

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
MACHINE_SUPPORTS_PDMAPPER = "True"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "True"
MACHINE_FSCONFIG_CONF = "kalama-fsconfig.conf"

MACHINE_SUPPORTS_SSR = "True"
# adb-only composition: no diag userspace in this tree;
# 901D(diag+adb) fails composite
USBCOMPOSITION = "4EE7"

# Partition conf
MACHINE_PARTITION_CONF = "kalama-partition.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "kalama-filesmap"

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"


### MACHINE_FEATURES ###
MACHINE_FEATURES += "qti-ab-boot qti-adsp qti-cdsp fastrpc qti-security qseecompat smcinvoke qti-smciqseecomd gptee ssgtzd ta_autoload qti-tzlog qti-crypto qti-video qti-camera qti-eva qti-uvc file-based-encryption"
QPERMISSIONS_ENABLE = "1"

#DEFAULT_ENFORCING = "enforcing"

DEFAULT_ENFORCING = "permissive"

#Used to enable/disable display in security module
MACHINE_SUPPORTS_DISPLAY = "False"
# Use the Kalama Adreno provider for the display HAL and Weston dependencies.
PREFERRED_PROVIDER_virtual/egl = "adreno"
PREFERRED_PROVIDER_virtual/libgles1 = "adreno"
PREFERRED_PROVIDER_virtual/libgles2 = "adreno"
PACKAGECONFIG:remove:kalama = "camx"

# packagegroups whose layers/recipes are still masked in qti-conf/console-recipe-mask.inc and cannot be provided yet on wrynose. this is with respect to#"sun" in qti-robotics-image.bb
# delete one entry per feature as its layer is unmasked and building.
CORE_IMAGE_EXTRA_INSTALL:remove:pn-qti-robotics-image = " \
	packagegroup-qti-audio packagegroup-qti-pulseaudio \
	packagegroup-qti-bluetooth \
	packagegroup-qti-qmmf \
	packagegroup-qti-eva packagegroup-qti-fastcv \
	packagegroup-qti-mmframeworks \
	packagegroup-qti-wifi packagegroup-qti-qcawifi \
	packagegroup-qti-robos packagegroup-qti-robos-addon \
	packagegroup-qti-touch \
	packagegroup-qti-dsp packagegroup-qti-data \
	qti-c2-module qti-umd-gadget qti-auto-framing-stabilization system-sample-apps \
	qcrosvm vmsharememory-test packagegroup-qti-video \
        packagegroup-qti-securemsm packagegroup-qti-sensors-ship \
        packagegroup-ros2-humble \
"

# Keep the display runtime explicit for this image.
# This also installs the MMRM module that displaydlkm builds against.
CORE_IMAGE_EXTRA_INSTALL:append:pn-qti-robotics-image = " \
	libdrm \
	display-hal-linux \
	mmdlkm \
	displaydlkm \
	mmrm-kernel \
	gbm \
	weston \
	display-commonsys \
	display-noship-linux \
	displaydevicetree \
	mmdevicetree \
	display-ship-linux \
	display-commonsys-prop \
        mmrm-devicetree \
"
RDEPENDS:packagegroup-qti-core-prop:remove = "chg-policy"
CFLAGS:append:pn-diag-router = " -Wno-error=incompatible-pointer-types"
MKDTUTIL:kalama = "mkdtboimg/bin/mkdtimg"

# GFX: Set adreno as preferred provider for OpenGL/EGL (not mesa)
PREFERRED_PROVIDER_virtual/libgles1 = "adreno"
PREFERRED_PROVIDER_virtual/libgles2 = "adreno"
PREFERRED_PROVIDER_virtual/egl      = "adreno"

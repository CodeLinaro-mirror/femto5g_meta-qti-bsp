#@TYPE: Machine
#@NAME: KALAMA
#@DESCRIPTION: Machine configuration for QTI MTP with KALAMA
BASEMACHINE ?= "pineapple"
require conf/machine/include/basemachine.inc

DEFAULTTUNE ?= "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

PREFERRED_PROVIDER_virtual/mkbootimg = "mkbootimg-gki"
PREFERRED_PROVIDER_virtual/mkdtimg   = "mkdtimg-gki"
PREFERRED_VERSION_linux-msm ?= "6.1"
PREFERRED_VERSION_linux-msm-headers ?= "6.1"
PREFERRED_VERSION_kernel-toolchain ?= "6.1.32bit"
PREFERRED_VERSION_kernel-toolchain-native ?= "6.1.32bit"
PREFERRED_VERSION_dtc-android-build ?= "1.6.0"
PREFERRED_VERSION_mkbootimg-gki ?= "6.1"
PREFERRED_VERSION_mkbootimg-gki-native ?= "6.1"
PREFERRED_VERSION_gki-kernel-modules ?= "5.15"
PREFERRED_VERSION_mod-signing-keys ?= "6.1"
PREFERRED_VERSION_synx-kernel ?= "1.0"
PREFERRED_VERSION_securemsmdlkm ?= "1.1"
PREFERRED_VERSION_sat-module ?= "4.1"

#### KERNEL ####
MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_VARIANT:qti-distro-debug ?= "debug_defconfig"
KERNEL_VARIANT:qti-distro-perf ?= "perf_defconfig"
KERNEL_MODULES_LIST = "modules.list.msm.pineapple-le"
KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.pineapple-le \
    modules.systemdlkm_blocklist.msm.pineapple-le \
"
# Check for msm-kernel or gki_kernel
KERNEL_TYPE = "dist"

#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""

INITRAMFS_IMAGE = "qti-ramdisk-image"
INITRAMFS_FSTYPES = "cpio.lz4"
VENDOR_INITRAMFS_IMAGE = "qti-vendor-ramdisk-image"

KERNEL_DEFCONFIG = "msm-kernel-pineapple_le-${KERNEL_VARIANT}"

#Various kernel directories
KERNEL_PLATFORM_PATH = "${WORKSPACE}/kernel-6.1/kernel_platform"
KERNEL_PREBUILT_PATH = "${WORKSPACE}/kernel-6.1/out/${KERNEL_DEFCONFIG}"
KERNEL_PREBUILT_DISTDIR = "${KERNEL_PREBUILT_PATH}/dist"

KERNEL_OUT_PATH = "${KERNEL_PREBUILT_PATH}"

KERNEL_CONFIG  ?= "build.config.msm.pineapple.le"
KERNEL_BUILD_CONFIG = "msm-kernel/${KERNEL_CONFIG}"

#### dtb ####
KERNEL_DTB_NAMES = "pineapple-v2.dtb pineapplep-v2.dtb pineapplep-qcs.dtb"

MACHINE_SUPPORTS_DTBO= "True"
BUILD_WITH_TECHPACKS = "1"
SKIP_VENDOR_BOOT = "False"

#### boot.img ####
KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
BOOT_HEADER_VERSION = "2"

#### systemd ####
SERIAL_CONSOLE ?= "115200;ttyMSM0"

#### cmdline ####
CONSOLE_PARAM:qti-distro-perf  = "qcom_geni_serial.con_enabled=0"
CONSOLE_PARAM:qti-distro-debug = "console=ttyMSM0,115200n8 earlycon qcom_geni_serial.con_enabled=1 androidboot.console=ttyMSM0 systemd.log_target=journal systemd.show_status=no"
HIBERNATION_PAPAMS = "hibernate=nocompress"
KERNEL_CMD_PARAMS = "${CONSOLE_PARAM} ${HIBERNATION_PAPAMS}"

#### others ####
PAGE_SIZE ?= '4096'
SDCARD_DEVICE = "mmcblk1p1"

#Abl would be enabled later
EXTRA_IMAGEDEPENDS += "edk2"
PREFERRED_VERSION_edk2 ?= "4.0"

# TODO: Temporary change to override BB_SIGNATURE_HANDLER set in local.conf.
# Other machines are already supporting OEEquivHash as hashing signature.
# Fix build issues observed in this machine and remove this override.
BB_SIGNATURE_HANDLER = "OEBasicHash"

#QSEEComCompat and QSEECom are mutually exlusive and QSEEComCompat depends on  smcinvoke
#lv-build builds the required listernes , le_qseecom enables qseecomd
MACHINE_FEATURES += "dm-verity-none"

MACHINE_MNT_POINTS = " \
	/persist \
	/firmware \
	/bt_firmware \
	/dsp \
	/overlay \
"

SYSTEM_SIZE_EXT4   ?= "2684354560"
PERSIST_SIZE_EXT4 ?= "7MiB"
# Define userdata dir, size to be used
USERDATA_DIR = "${@bb.utils.contains('MACHINE_MNT_POINTS', '/overlay', 'overlay', 'data', d)}"
USERDATA_SIZE ?= "60GiB"

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
MACHINE_SUPPORTS_PDMAPPER = "True"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "True"
MACHINE_FSCONFIG_CONF = "pineapple-fsconfig.conf"

MACHINE_SUPPORTS_SSR = "True"

USBCOMPOSITION = "901D"

# Partition conf
MACHINE_PARTITION_CONF = "pineapple-partition.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "pineapple-filesmap"

### MACHINE_FEATURES ###
MACHINE_FEATURES += "qti-ab-boot qti-audio qti-adsp qti-cdsp qti-uvc qti-eva qti-tzlog qti-crypto qseecompat smcinvoke qti-smciqseecomd file-based-encryption "

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"

DISTRO_FEATURES:append = " qti-uvc "
DISTRO_FEATURES:remove = "qti-fastcv virtualization ros2 qirp-sdk qti-ib2c qti-auto-framing-stabilization "


QPERMISSIONS_ENABLE = "1"

DEFAULT_ENFORCING = "enforcing"
MACHINE_SUPPORTS_DISPLAY = "False"

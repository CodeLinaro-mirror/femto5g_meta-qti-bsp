#@TYPE: Machine
#@NAME: qcm4325-mtp-32
#@DESCRIPTION: Machine configuration for QCM4325-mtp

require conf/machine/include/qcm4325-mtp.inc
require conf/machine/qcm4325-mtp.conf

PACKAGE_ARCHS:remove = " qcm4325-mtp"

# Multilib configuration
MULTILIB_ENABLED ?= "True"
require ${@bb.utils.contains('MULTILIB_ENABLED', 'False', '', 'conf/multilib.conf', d)}
MULTILIBS = "${@bb.utils.contains('MULTILIB_ENABLED', 'False', '', 'multilib:lib32', d)}"
DEFAULTTUNE:virtclass-multilib-lib32 = "${@bb.utils.contains('MULTILIB_ENABLED', 'False', '', 'armv7ahf-neon', d)}"
MLIBPREFIX = "${@bb.utils.contains('MULTILIB_ENABLED', 'False', '', 'lib32-', d)}"
TOOLCHAIN_TYPE = "internal"
IMAGE_INSTALL:append = " lib32-glibc lib32-libgcc lib32-libstdc++"

DISTRO_FEATURES:remove = " tensorflow-lite"

NON_MULTILIB_RECIPES += " sat-module gki-kernel-modules kernel-modules msm-bus security-tests-llvm recovery-ab mmrm-kernel drm wlan-platform qcacld32-ll-debug"
NON_MULTILIB_RECIPES += " video-kernel audiodlkm mmdlkm make-mod-scripts displaydlkm cameradlkm securemsmdlkm graphicsdlkm touchdlkm bt-dlkm-kernel btdevicetree dataipa"

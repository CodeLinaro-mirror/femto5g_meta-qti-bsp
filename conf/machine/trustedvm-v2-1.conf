#@TYPE: Machine
#@NAME: TRUSTEDVM-V2-1
#@DESCRIPTION: Machine configuration for QTI MTP with TRUSTEDVM

BASEMACHINE = "trustedvm-v2-1"
require conf/machine/include/basemachine.inc

DEFAULTTUNE = "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-msm"
PREFERRED_VERSION_linux-msm = "${VM_KERNEL_VERSION}"
PREFERRED_VERSION_linux-msm-headers ?= "${PREFERRED_VERSION_linux-msm}"
PREFERRED_VERSION_kernel-toolchain ?= "${PREFERRED_VERSION_linux-msm}"
PREFERRED_VERSION_kernel-toolchain-native = "${PREFERRED_VERSION_linux-msm}"
PREFERRED_PROVIDER_virtual/refpolicy = "refpolicy-mls-vm"

LLVM_VERSION = "8.0"

PAGE_SIZE ?= '4096'

EXTRA_IMAGECMD ?= "-N 2048"

KERNEL_IMAGETYPE = "Image"
KERNEL_CMD_PARAMS = ""
KERNEL_VARIANT = ""
KERNEL_VARIANT:qti-distro-base-debug = "debug_"
SERIAL_CONSOLE = "115200 hvc0"
VM_TARGET = "${VM_KERNEL_TARGET}"

KERNEL_DEFCONFIG = "msm-kernel-${VM_TARGET}_tuivm-${KERNEL_VARIANT}defconfig"

CLANG_VERSION = "r487747c"
KERNEL_PLATFORM_PATH ?= "${WORKSPACE}/kernel-${PREFERRED_VERSION_linux-msm}/kernel_platform/"
KERNEL_TYPE = "dist"

KERNEL_PREBUILT_DISTDIR ?= "${WORKSPACE}/kernel-${PREFERRED_VERSION_linux-msm}/out/msm-kernel-${VM_TARGET}_tuivm-${KERNEL_VARIANT}defconfig/dist"

MACHINE_USES_KERNEL_PREBUILTS = "True"
KERNEL_PREBUILT_PATH ?= "${WORKSPACE}/kernel-${PREFERRED_VERSION_linux-msm}/out/msm-kernel-${VM_TARGET}_tuivm-${KERNEL_VARIANT}defconfig"
KERNEL_OUT_PATH = "${WORKSPACE}/kernel-${PREFERRED_VERSION_linux-msm}/out/msm-kernel-${VM_TARGET}_tuivm-${KERNEL_VARIANT}defconfig/"
KERNEL_BUILD_CONFIG = "msm-kernel/build.config.msm.${VM_TARGET}.tuivm"

KERNEL_DTB_NAMES = "seraph-vm-rumi.dtb seraph-vm-atp.dtb seraphp-vm-atp.dtb seraph-vm-idp-dtof.dtb seraphp-vm-idp-dtof.dtb seraph-vm-idp.dtb seraphp-vm-idp.dtb"

# filesystem configurations to be applied on image.
MACHINE_FSCONFIG_CONF = "trustedvm-fsconfig.conf"
MACHINE_SUPPORTS_USB = "False"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "False"
MACHINE_SUPPORTS_DISPLAY = "False"
MACHINE_SUPPORTS_SECUREMSM = "True"
MACHINE_SUPPORTS_MINK = "True"
MACHINE_SUPPORTS_TOUCH = "False"
MACHINE_SUPPORTS_OEMVM = "False"
MACHINE_MNT_POINTS = ""
ENABLE_ADB = "False"
# Formats of root filesystem images.
IMAGE_FSTYPES += "ext4"
IMAGE_INIT_MANAGER = "systemd"

VALG = 'False'

SYSTEMIMAGE_TARGET = "system.img"
VMUSERDATAIMAGE_TARGET = "vm-userdata.img"
VMIMAGE_TARGET = "vm-bootsys.img"
VMPERSIST_TARGET = "vm-persist.img"
DTB_TARGET = "vm.dtb"
KERNEL_OFFSET_TRUSTEDVM = "0x0"
DTB_OFFSET_TRUSTEDVM = "0x2000000"
RAMDISK_OFFSET_TRUSTEDVM = "0x2400000"
CMDLINE_OFFSET_TRUSTEDVM = "0x2401000"

KERNEL_OFFSET_OEMVM = "0x0"
DTB_OFFSET_OEMVM = "0x2000000"
RAMDISK_OFFSET_OEMVM = "0x2100000"
CMDLINE_OFFSET_OEMVM = "0x2101000"

# Ramdisk size is 8 MB
RAMDISK_SIZE = "10388608"

SYSTEM_SIZE_EXT4 ?= "235000000"
USERDATA_SIZE_EXT4 ?= "25000000"
PERSIST_IMAGE_ROOTFS_SIZE = "119000000"
PERSIST_SIZE_EXT4 = "119000000"
VM_PERSIST_SIZE_EXT4 ?= "125829120"
VM_SIZE_EXT4 ?= "560000000"

MACHINE_FEATURES:append = " qti-multivm dm-verity-cpio-cmdline qti-vm qti-vm-persist qti-smmu-proxy vm-dynamic-memresize qti-vm-target qti-vm-vsock qti-vm-mink"

PREFERRED_PROVIDER_virtual/base-utils = "toybox"
VIRTUAL-RUNTIME_base-utils = "toybox"
VIRTUAL-RUNTIME_base-utils-hwclock = ""
VIRTUAL-RUNTIME_base-utils-syslog = ""
VIRTUAL-RUNTIME_login_manager = ""
INIT_MANAGER = "systemd"
TOYBOX_RAMDISK = "True"

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"


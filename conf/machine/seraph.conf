#@TYPE: Machine
#@NAME: seraph
#@DESCRIPTION: Machine configuration for QTI HDK with seraph
BASEMACHINE ?= "seraph"
require conf/machine/include/basemachine.inc

DEFAULTTUNE ?= "aarch64"
include conf/machine/include/arm/arch-armv8a.inc

require recipes-kernel/linux-msm/msm-common.inc

PREFERRED_VERSION_mod-blacklist ?= "2.0"

MACHINE_USES_KERNEL_PREBUILTS = "False"
PREFERRED_PROVIDER_virtual/kernel   = "linux-common"
PREFERRED_PROVIDER_linux-msm-headers = "linux-soc-headers"
PREFERRED_VERSION_edk2 = "git"
# Pin the version on the actual provider PN
PREFERRED_VERSION_linux-soc-headers = "6.12"
PREFERRED_VERSION_kernel-toolchain-native = "6.%"

# Remove/clear any version pin on the old PN (prevents the warning)
PREFERRED_VERSION_linux-msm-headers = ""

TARGET_CONFIG_FRAGMENTS = "seraph.cfg"
TARGET_CONFIG_FRAGMENTS:append = " ${@oe.utils.vartrue('DEBUG_BUILD', ' seraph_debug.cfg', '', d)}"

SERAPH_BASE_DT = "seraph.dtb seraphp.dtb seraph-v1.1.dtb seraphp-v1.1.dtb"
SERAPH_OVERLAY = " \
    seraph-atp-overlay-le.dtbo \
    seraphp-atp-overlay-le.dtbo \
    seraph-idp-overlay-le.dtbo \
    seraphp-idp-overlay-le.dtbo \
    seraph-idp-dtof-overlay-le.dtbo \
    seraphp-idp-dtof-overlay-le.dtbo \
    seraph-idp-no-display-overlay-le.dtbo \
    seraphp-idp-no-display-overlay-le.dtbo \
    seraph-idp-no-display-no-gpu-overlay-le.dtbo \
    seraphp-idp-no-display-no-gpu-overlay-le.dtbo \
    seraph-v1.1-atp-overlay-le.dtbo \
    seraphp-v1.1-atp-overlay-le.dtbo \
    seraph-v1.1-idp-overlay-le.dtbo \
    seraphp-v1.1-idp-overlay-le.dtbo \
    seraph-v1.1-idp-dtof-overlay-le.dtbo \
    seraphp-v1.1-idp-dtof-overlay-le.dtbo \
    seraph-v1.1-idp-no-display-overlay-le.dtbo \
    seraphp-v1.1-idp-no-display-overlay-le.dtbo \
    seraph-v1.1-idp-no-display-no-gpu-overlay-le.dtbo \
    seraphp-v1.1-idp-no-display-no-gpu-overlay-le.dtbo \
    seraphp-v1.1-qar-3rd-camera-audio-overlay-le.dtbo \
    seraphp-v1.1-qar-camera-audio-overlay-le.dtbo \
    seraphp-v1.1-qar-overlay-le.dtbo \
    seraphp-qar-camera-audio-overlay-le.dtbo \
    seraphp-qar-overlay-le.dtbo \
    seraph-rumi-overlay-le.dtbo \
"
TARGET_DTBS = "${SERAPH_BASE_DT} ${SERAPH_OVERLAY}"

# clang version for kernel toolchain 6.12
USE_CLANG = "True"
CLANG_VERSION = "r536225"

KERNEL_MODULES_LIST = "modules-lists/modules.list.msm.seraph-le"
KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.seraph-le \
    modules.systemdlkm_blocklist.msm.seraph-le \
"

# Check for soc-repo or gki_kernel

#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""

KERNEL_IS_SOC_REPO = "True"

#### boot.img ####
KERNEL_IMAGETYPE = "Image"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
BOOT_HEADER_VERSION = "3"

#### systemd ####
SERIAL_CONSOLE ?= "115200;ttyMSM0"

#### cmdline ####
CONSOLE_PARAM:qti-distro-xr-perf  = ""
CONSOLE_PARAM:qti-distro-xr-debug = "console=ttyMSM0,115200n8 earlycon=qcom_geni,0xa94000 qcom_geni_serial.con_enabled=1 loglevel=8"
KERNEL_CMD_PARAMS = "${CONSOLE_PARAM} firmware_class.path=/vendor/soccp_firmware/image"

# TODO: Temporary change to override BB_SIGNATURE_HANDLER set in local.conf.
# Other machines are already supporting OEEquivHash as hashing signature.
# Fix build issues observed in this machine and remove this override.
BB_SIGNATURE_HANDLER = "OEBasicHash"

#QSEEComCompat and QSEECom are mutually exclusive; QSEEComCompat depends on smcinvoke.
#qseecompat (QSEEComCompat) is enabled for seraph; do not enable QSEECom alongside it.
#lv-build builds the required listeners, le_qseecom enables qseecomd
MACHINE_FEATURES += "dm-verity-none"

MACHINE_MNT_POINTS = " \
        /persist \
        /firmware \
        /vendor/bt_firmware \
        /dsp \
        /overlay \
        /vendor/soccp_firmware \
"

GENERATED_MACHINE_MNT_POINTS = "/lib/modules"

SYSTEM_SIZE_EXT4   ?= "4294967296"
VDLKM_SIZE_EXT4 ?= "98MiB"
PERSIST_SIZE_EXT4 ?= "7MiB"
# Define userdata dir, size to be used
USERDATA_DIR = "${@bb.utils.contains('MACHINE_MNT_POINTS', '/overlay', 'overlay', 'data', d)}"
USERDATA_SIZE ?= "8589934592"

# Formats of root filesystem images
IMAGE_FSTYPES += "ext4"
MACHINE_SUPPORTS_PDMAPPER = "True"
MACHINE_SUPPORTS_ANDROID_PROPERTIES = "True"
MACHINE_FSCONFIG_CONF = "seraph-fsconfig.conf"
MACHINE_SUPPORTS_SSR = "True"

USBCOMPOSITION = "9060"

# Partition conf
MACHINE_PARTITION_CONF = "seraph-partition.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "seraph-filesmap"

### MACHINE_FEATURES ###
MACHINE_FEATURES += "qti-ab-boot qti-adsp qti-cdsp fastrpc qti-tzlog qti-crypto qti-smmu-proxy qti-security qti-audio smcinvoke qti-smciqseecomd qti-rpmb minkdaemon gptee dm-verity-none qti-avb qwesd qti-ops qti-widevine file-based-encryption qseecompat qti-hdcp"
# Enable HDCP Test driver only in DEBUG builds
MACHINE_FEATURES += "${@oe.utils.vartrue('DEBUG_BUILD', 'qti-hdcp-test', '', d)}"

# On msm-5.4 or above ufs driver supports BSG Device.
UFS_BSG_DEV_USAGE = "True"

### DISTRO_FEATURES ###
DISTRO_FEATURES +="vulkan"
DISTRO_FEATURES:remove = "virtualization ros2 qirp-sdk qti-ib2c qti-uvc qti-umd-gadget qti-auto-framing-stabilization tensorflow-lite"

QPERMISSIONS_ENABLE = "1"

#Append 'avb-verity=enabled' to cmd line when avb is enabled.
KERNEL_CMD_PARAMS:append  = "${@bb.utils.contains('MACHINE_FEATURES', 'qti-avb', ' avb-verity=enabled', '', d)}"

# pack for installation of ESDK
COREBASE_FILES:append = " meta-poky"

# eSDK locked-sstate validation can require fallback execution for kernel-provider
# tasks (linux-common/soc-modules/make-mod-scripts) on seraph.
sdk_extraconf:append = 'BB_SETSCENE_ENFORCE_IGNORE_TASKS:append = " linux-common:* make-mod-scripts:* soc-modules:*"'

#Flag to disable usbd.service
USB_PERIPHERAL_ONLY_MODE = "True"

# Set preferred versions for kernel-related components to ensure
# consistent and compatible selection across the build.
PREFERRED_VERSION_cameradtb ?= "6.12"
PREFERRED_VERSION_cameradlkm ?= "6.1"
PREFERRED_VERSION_video-kernel = "6.12"
PREFERRED_VERSION_synx-kernel ?= "6.12"
PREFERRED_VERSION_synx-devicetree ?= "6.12"
PREFERRED_VERSION_synx-kernel-header ?= "6.12"
PREFERRED_VERSION_securemsmdlkm ?= "6.12"


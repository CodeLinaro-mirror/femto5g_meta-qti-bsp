#@TYPE: Machine
#@NAME: qcm2290-mtp
#@DESCRIPTION: Machine configuration for QCM220-MTP

require recipes-kernel/linux-msm/msm-common.inc
require conf/machine/include/qcm2290-mtp.inc

### dtb ###
KERNEL_DTB_NAMES   = "scuba-iot.dtb scuba-iot-2gb.dtb scubap-iot.dtb scubap-iot-idp.dtb scubap-iot-idp-2gb.dtb "

### boot.img ###
KERNEL_IMAGETYPE   = "Image"
KERNEL_BASE        = "0x80000000"
KERNEL_TAGS_OFFSET = "0x80000000"
#KERNEL_TAGS_OFFSET = "0x81900000"
BOOT_HEADER_VERSION = "2"

CONSOLE_PARAM     ?= ""
CONSOLE_PARAM:qti-distro-perf  ?= "console=ttyMSM0,115200n8"
CONSOLE_PARAM:qti-distro-debug ?= "console=ttyMSM0,115200n8 earlycon=qcom_geni,0x4a90000 qcom_geni_serial.con_enabled=1 androidboot.console=ttyMSM0"

KERNEL_CMD_PARAMS  = "noinitrd ${CONSOLE_PARAM} androidboot.hardware=qcom androidboot.memcg=1 lpm_levels.sleep_disabled=1 video=vfb:640x400,bpp=32,memsize=3072000 msm_rtb.filter=0x237 service_locator.enable=1 swiotlb=2048 loop.max_part=7 cgroup.memory=nokmem,nosocket reboot=panic_warm net.ifnames=0 log_buf_len=2M"

MSM_KERNEL_VERSION = "5.15"

PREFERRED_PROVIDER_gtest = "googletest"

PREFERRED_VERSION:securemsmdlkm ?= "2.0"

DEFAULTTUNE = "aarch64"

#### Kernel ####
KERNEL_MODULES_LIST = "modules.list.msm.bengal.le"
KERNEL_VARIANT:qti-distro-debug = "consolidate"
KERNEL_VARIANT:qti-distro-perf = "gki"

KERNEL_DEFCONFIG = "msm-kernel-bengal_le-${KERNEL_VARIANT}"

KERNEL_TYPE = "msm-kernel"

KERNEL_CONFIG  ?= "build.config.msm.bengal.le"
KERNEL_BUILD_CONFIG = "msm-kernel/${KERNEL_CONFIG}"

UFS_BSG_DEV_USAGE = "True"

MACHINE_FEATURES += "dm-verity-none"

##############################################################
# SELinux is set in enforcing mode, by default, as below;
# DEFAULT_ENFORCING ?= "enforcing"
# During bring up, to unblock the technology teams, SELinux is set to permissive.
##############################################################
#DEFAULT_ENFORCING = "permissive"

SERIAL_CONSOLE    ?= ""
SERIAL_CONSOLE:qti-distro-debug ?= "115200 ttyMSM0"

PREFERRED_PROVIDER_virtual/libgles1 = "adreno"
PREFERRED_PROVIDER_virtual/libgles2 = "adreno"
PREFERRED_PROVIDER_virtual/egl      = "adreno"

# Conf with partition entries required for machine.
MACHINE_PARTITION_CONF = "qcm2290-mtp-partition.conf"

# filesystem configurations to be applied on image.
MACHINE_FSCONFIG_CONF = "qrbx210-fsconfig.conf"

# File indicating firmware residing places on device.
MACHINE_FILESMAP_CONF = "bengal-filesmap"

# Sizes for EXT4 (in bytes)
SYSTEM_SIZE_EXT4 = "3221225472"
USERDATA_SIZE = "4294967296"

GENERATE_AB_OTA_PACKAGE = "1"

KERNEL_MODULES_BLACKLIST = "\
    modules.vendor_blocklist.msm.bengal.le \
    modules.systemdlkm_blocklist.msm.bengal.le \
"
#extra module blacklist
EXTRA_BLACKLIST_MOD ?= ""

MACHINE_SUPPORTS_PDMAPPER = "True"

MACHINE_SUPPORTS_SSR = "True"

# MACHINE_FEATURES ##
# emmc-boot:            Machine supports eMMC device
# ubwc:                 Machine supports UBWC hardware
# qti-wifi:             Machine supports QTI WiFi solution
# qti-audio:            Machine supports QTI audio solution
# qti-audio-encoder:    Machine supports QTI audio encoder
# qti-audio-cal:        Machine supports QTI audio calibration solution
# qti-adsp:             Machine supports QTI adsp solution
# qti-cvp:               Machine supports QTI cvp solution
# qti-ab-boot:          Machine support a/b boot
# opencl:               Machine supports OpenCL driver
# qti-tflite-delegate:  Machine supports tensorflow lite hardware acceleration
# drm :                 Machine supports DRM display drivers
# dm-verity-bootloader: Machine supports bootloader-based dm-verity implementation
# qti-security:         Support QTI security solution
# qti-gst-ros2:         Machine supports QTI Gst Ros2 solution
# qti-fscrypt:          Machine supports FBE using fscrypt
# qti-hdcp-qseecom      Machine supports HDCP qseecom communicator driver
# ota-package-verification: Support OTA package authentication

MACHINE_FEATURES += "emmc-boot ubwc qti-wifi hasting qti-adsp qti-audio qti-audio-encoder \
                     qti-audio-cal qti-ab-boot qti-cdsp qti-cvp opencl qti-tflite-delegate \
                     qti-camera drm qti-npu qti-security qti-gst-ros2 qti-video \
                     qti-slpi qti-sensors-prop tdk-sensors qti-display qti-qseecom \
                     qti-tzlog qwesd smcinvoke qti-location qti-data-modem"

BLAST_SOURCE_ROOT := "${LAYERDIR}/../../sources"

BBPATH .= ":${LAYERDIR}"

BBFILE_COLLECTIONS        += "qti-bsp"
BBFILE_PRIORITY_qti-bsp    = "10"
BBFILE_PATTERN_qti-bsp    := "^${LAYERDIR}/"

LAYERSERIES_COMPAT_qti-bsp = "scarthgap wrynose"

LICENSE_PATH += "${LAYERDIR}/files/common-licenses"

# Set a variable to get to the top of the metadata location
QTIBASE = '${@os.path.normpath("${LAYERDIR}/")}'

# QTI layers are kept together, but they are not necessarily located under
# COREBASE.  Derive their common parent from this layer so references remain
# valid when OE-Core and QTI metadata are separate repositories.
QTI_METADATA_ROOT := "${@os.path.dirname(os.path.dirname(os.path.dirname(d.getVar('FILE'))))}"

# Tools needed on the build host for usage within build tasks by recipes of this layer.
HOSTTOOLS_NONFATAL += "xgettext msgmerge msgfmt gmsgfmt java zip"

BBFILES += " ${LAYERDIR}/recipes-*/*/*.bb \
             ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/virtualization-layer/*/*/*.bbappend \
"

QCOM_COMMON_LICENSE_DIR = "${@os.path.normpath("${LAYERDIR}")+'/files/common-licenses/'}"


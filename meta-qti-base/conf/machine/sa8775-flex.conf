#@TYPE: Machine
#@NAME: sa8775-flex
#@DESCRIPTION: Machine configuration for QTI sa8775-flex

BASEMACHINE = "sa8775-flex"
include conf/machine/include/sa8775.inc

RECOVERY_IMAGE = "0"

VARIANT_ID="flex"

EXTRA_IMAGEDEPENDS += "edk2"
CLANG_BIN="${SRC_DIR_ROOT}/prebuilts/clang/host/linux-x86/clang-r416183b/bin/"

PREFERRED_PROVIDER_virtual/kernel = "linux-qcom-custom-rt"
PREFERRED_PROVIDER_virtual/kernel-headers = "linux-kernel-qcom-headers"
PREFERRED_VERSION_linux-qcom-custom-rt = "6.6"
preferred-kernel = "PREFERRED_VERSION_linux-qcom-custom-rt"
kernel-version = "${PREFERRED_VERSION_linux-qcom-custom-rt}"

KERNEL_ARCH = "gen4auto"
KERNEL_IMAGE_HEADER_VERSION = "2"
KERNEL_BASE = "0x80000000"
KERNEL_TAGS_OFFSET = "0x1e00000"
KERNEL_CONFIG = "defconfig"
KERNEL_BASE_DTB = "arch/arm64/boot/dts/qcom/sa8255p-ride.dtb"

KERNEL_CMD_PARAMS = "rw rootwait console=ttyMSM0,115200,n8 no_console_suspend=1 androidboot.hardware=qcom androidboot.console=ttyMSM0 lpm_levels.sleep_disabled=1 msm_rtb.filter=0x237 earlycon=qcom_geni,0xa8c000 firmware_class.path=/firmware/vm/boot systemd.gpt_auto=0 cgroup.memory=nokmem,nosocket systemd.unified_cgroup_hierarchy=1 qcom_scm.download_mode=1 rcupdate.rcu_expedited=1 rcu_nocbs=0-7 rcupdate.rcu_normal_after_boot=0 page_owner=on quiet systemd.show_status=1 pcie_pme=nomsi "
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains('MACHINE_FEATURES', 'early-ramdisk-init', ' rdinit=/sbin/early-ramdisk-init early-ramdisk.mode=1 ', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'console=ttyMSM0,115200,n8', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'earlycon=qcom_geni,0xa8c000', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'no_console_suspend=1', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains_any('VARIANT', 'perf user', 'page_owner=on', '', d)}"
KERNEL_CMD_PARAMS:remove = "${@bb.utils.contains('IMAGE_FEATURES', 'read-only-rootfs', 'rw', '', d)}"
KERNEL_CMD_PARAMS:append = "${@bb.utils.contains_any('VARIANT', 'perf user', ' no_hotplug_area=0x80000000,0x280000000;0xa30000000,0x190000000;0xd00000000,0xC0000000;0xe80000000,0x83000000 dyn_memhotplug ', '', d)}"

OOT_DTBOS = "sa8775p_overlay.dtbo \
             sa8775p-v3_overlay.dtbo \
             sa8775p_overlay_pcie_ep.dtbo \
             sa8775p-sw-eth-phy_overlay.dtbo"

KERNEL_IMAGETYPE = "Image"

OOT_DTBS = "sa8775p-ride-mx/sa8775p-ride-mx.dtb"

require conf/distro/include/auto-common.inc

DISTRO_NAME = "Auto Gvm VirtIO"

PRODUCT = "${MACHINE}"

DISTRO_FEATURES:append = " \
    qti-adsp \
    qti-cdsp \
    qti-cdsp1 \
    qti-core \
    qti-data \
    qti-extra \
    qti-tools \
    qti-security \
    qti-avb \
    qti-virtio \
    ab-boot-support \
"
BBMASK += "meta-qti-bsp/meta-qti-distro/recipes-core/images/machine-image-initramfs.bb"
BBMASK += "meta-qti-bsp-prop/meta-qti-headless-prop/recipes-security/mink/mink.bb"
BBMASK += "meta-qti-bsp/meta-qti-headless/recipes-kernel/linux-msm/linux-msm_6.1.bb"
BBMASK += "meta-qti-bsp/meta-qti-headless/recipes-kernel/toolchain/kernel-toolchain-native_5.15.bb"
BBMASK += "meta-qti-bsp-prop/meta-qti-headless-prop/recipes-kernel/kernel-devicetree/kernel-devicetree.bb"

# Switch package format to rpm for GVM
PACKAGE_CLASSES = "package_rpm"

# Mesa/virgl for virtio-gpu
# No physical Adreno GPU on this virtio VM target — use Mesa's virgl Gallium
# driver over virtio-gpu instead of the proprietary adreno/gbm recipes.
DISTRO_FEATURES:append = " opengl wayland"

PREFERRED_PROVIDER_virtual/egl         = "mesa"
PREFERRED_PROVIDER_virtual/libgles1    = "mesa"
PREFERRED_PROVIDER_virtual/libgles2    = "mesa"
PREFERRED_PROVIDER_virtual/libgbm      = "mesa"
PREFERRED_PROVIDER_virtual/wayland-egl = "mesa"

VIRTUAL-RUNTIME_egl         = "mesa"
VIRTUAL-RUNTIME_libgles1    = "mesa"
VIRTUAL-RUNTIME_libgles2    = "mesa"
VIRTUAL-RUNTIME_wayland-egl = "mesa"

BB_MULTI_PROVIDER_ALLOWED += "virtual/wayland-egl virtual/egl virtual/libgles1 virtual/libgles2 virtual/libgbm"

PREFERRED_VERSION_wayland-protocols = "1.49"
PREFERRED_VERSION_mesa              = "26.0.0"

require conf/distro/include/auto-common.inc

DISTRO_NAME = "auto"

DISTRO_FEATURES:append:sa81x5 = "${@bb.utils.contains_any('VARIANT', 'perf user', ' early_init', '', d)}"

DISTRO_FEATURES:append = " \
    qti-adsp \
    qti-audio \
    qti-bluetooth \
    qti-fastcv \
    qti-audio-ar \
    qti-camera \
    qti-cdsp \
    qti-core \
    qti-data \
    qti-display \
    qti-extra \
    qti-graphics \
    qti-ml \
    qti-multimedia \
    qti-security \
    qti-tools \
    qti-vnw \
    qti-location \
    qti-avb \
    ab-boot-support \
    qti-wlan \
    qti-compute-platform \
    qti-rideware \
"

DISTRO_FEATURES:remove = "\
    qti-location \
    early-eth \
"

DISTRO_FEATURES:remove:monaco = "\
    qti-ml \
    qti-audio \
    qti-fastcv \
    qti-camera \
    qti-lxc \
"

# Disable qti-avb on minimal as the feature not need
DISTRO_FEATURES:remove:pn-core-image-minimal = "qti-avb"

# Disable qti-avb on ubuntu as the feature not need
DISTRO_FEATURES:remove = "\
    ${@bb.utils.contains('TCMODE', 'external-ubuntu', 'qti-avb', '', d)} \
"

DISTRO_FEATURES:append:sa8650-adas = " \
    qti-fde \
"

DISTRO_FEATURES:append:sa8797 = " \
    qti-rumi \
    qti-audio-aw \
"

DISTRO_FEATURES:remove:sa8797 = " \
    qti-adsp \
    qti-audio \
    qti-audio-ar \
    qti-bluetooth \
    qti-fastcv \
    qti-camera \
    qti-cdsp \
    qti-display \
    qti-extra \
    qti-graphics \
    qti-ml \
    qti-vnw \
    qti-location \
    qti-avb \
    ab-boot-support \
    qti-wlan \
"
